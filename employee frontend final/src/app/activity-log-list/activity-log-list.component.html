<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Activity Log</h2>
    <button class="btn btn-sm btn-outline-primary" type="button" (click)="loadLogs()">Refresh</button>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>Time</th>
          <th>User</th>
          <th>Page</th>
          <th>Action</th>
          <th>Status</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let log of logs">
          <td>{{ log.timestamp | date: 'medium' }}</td>
          <td>{{ log.user }}</td>
          <td>{{ log.page }}</td>
          <td>{{ log.action }}</td>
          <td>
            <span class="badge" [ngClass]="{
              'bg-success': log.status === 'SUCCESS',
              'bg-info': log.status === 'INFO',
              'bg-warning text-dark': log.status === 'WARNING',
              'bg-danger': log.status === 'ERROR'
            }">
              {{ log.status }}
            </span>
          </td>
          <td>{{ log.details || '—' }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!logs.length" class="alert alert-secondary mt-3">
    No activity has been recorded yet.
  </div>
</div>
